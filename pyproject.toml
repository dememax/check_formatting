# Unified tooling configuration for check_formatting — check_formatting project

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "check-formatting"
dynamic = ["version"]
description = "Project-agnostic formatting, linting, and static-analysis orchestration"
readme = "README.md"
requires-python = ">=3.14"
license = "GPL-3.0-only"
authors = [
    { name = "Maxime P. DEMENTYEV", email = "dememax@hotmail.com" },
]
dependencies = []

[project.scripts]
check_formatting = "check_formatting.cli:main"

[project.urls]
Repository = "https://github.com/dememax/check_formatting"

[tool.setuptools.dynamic]
version = { attr = "check_formatting.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py314"
required-version = ">=0.16.5,<=0.16.6"

[tool.ruff.lint]
# B:   flake8-bugbear (design/logic issues)
# E4/E7/E9: pycodestyle (imports, statements, syntax errors)
# F:   pyflakes (undefined names, unused imports)
# UP:  pyupgrade (modernize syntax to 3.14)
# I:   isort (import ordering)
# RUF: ruff-specific rules
# SIM: flake8-simplify (code simplification)
# PT:  flake8-pytest-style (pytest standards)
# ANN: flake8-annotations (enforce type hints)
# TCH: flake8-type-checking (manage typing imports)
select = ["B", "E4", "E7", "E9", "F", "UP", "I", "RUF", "SIM", "PT", "ANN", "TCH"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
